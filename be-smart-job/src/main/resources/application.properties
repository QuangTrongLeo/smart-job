# ==========================================
# APPLICATION & SERVER CONFIG
# ==========================================
app.cors.client-url=${CLIENT_URL:http://localhost:5173}
spring.application.name=be-smart-job
server.port=${PORT:8080}

# ==========================================
# DATABASE CONFIGURATION (MongoDB Atlas Cloud)
# ==========================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/smart_job_db}

# ==========================================
# MAIL CONFIGURATION (SMTP Gmail)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.data.mongodb.auto-index-creation=true

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# Cung c?p 1 chu?i secret m?c ??nh ?? dài cho môi tr??ng Local
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# CLOUDINARY CONFIGURATION (Upload File/CV)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_NAME:dummy_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_secret}

# ==========================================
# AI INTEGRATION (OpenAI API)
# ==========================================
openai.api.key=${OPENAI_API_KEY:dummy_openai_key}

# ==========================================
# MULTIPART / FILE UPLOAD CONFIG (Cho phép up CV ??n 10MB)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.context-path=/smart-job/api